name: Hosting Agent Preview

on:
  workflow_dispatch:
  push:
    branches:
      - preview
    paths:
      - 'agents/hosting/**'
      - 'src/lib/**'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    # Cloudflare credentials live in this GitHub environment, not repository
    # secrets, so only jobs that declare it - running refs its protection
    # rules allow - can read them.
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The dispatch-namespace binding in env.preview names this service, so
      # it must exist before the agent deploys. Preview has its OWN outbound
      # (hosting-outbound-preview): this workflow redeploys it on every push,
      # and a shared instance would put preview-branch outbound code on
      # production apps' egress.
      - name: Deploy Outbound Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ vars.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID}}
          workingDirectory: 'agents/hosting'
          packageManager: npm
          command: deploy --config wrangler.outbound.jsonc --env preview

      - name: Deploy Preview
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ vars.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID}}
          workingDirectory: 'agents/hosting'
          packageManager: npm
          # Needs the cfbase-apps-preview namespace to exist first (Phase B
          # launch checklist); serving stays off (env.preview has no
          # HOSTING_DOMAIN), so this only exercises the upload path.
          environment: preview
