name: Hosting Agent Prod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agents/hosting/**'
      - 'src/lib/**'

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    name: Deploy Prod
    # Cloudflare credentials live in this GitHub environment, not repository
    # secrets, so only jobs that declare it - running refs its protection
    # rules allow - can read them.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The dispatch-namespace binding in env.production names this service,
      # so it must exist before the agent deploys.
      - name: Deploy Outbound Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ vars.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID}}
          workingDirectory: 'agents/hosting'
          packageManager: npm
          command: deploy --config wrangler.outbound.jsonc

      - name: Deploy Prod
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ vars.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID}}
          workingDirectory: 'agents/hosting'
          packageManager: npm
          # The top level of wrangler.jsonc is the self-hosted default;
          # cloudflarebase.com's own configuration lives in env.production,
          # which pins the Worker name back to `hosting-agent`. This deploy
          # needs the cfbase.dev zone, the cfbase-apps namespace, and the
          # CF_ACCOUNT_ID/CF_HOSTING_API_TOKEN worker secrets to exist first
          # (Phase B launch checklist in docs/managed-service-design.md).
          environment: production
