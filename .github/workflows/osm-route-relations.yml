name: OSM route relations -> per-city transit pmtiles

# "Compute-near-data" pass over the planet.pbf sitting in the geo-datalake R2
# bucket (88 GiB): streams it from R2 (fast CF<->GH link, zero local traffic),
# filters route relations + member ways with osmium, assembles
# MultiLineStrings per city, and uploads <slug>-osmtransit.pmtiles to R2
# globe/basemaps/. The extraction scripts + city list live in the geo site
# repo (ayeeff/astrogl, branch preview, layer/osm-routes/).
#
# Lives in this repo because GitHub only registers workflow_dispatch on the
# default branch, and astrogl's default branch (master) must not be touched.

on:
  workflow_dispatch:
    inputs:
      planet_key:
        description: "planet pbf key in geo-datalake/sources/osm/"
        default: "planet-260914.osm.pbf"
      site_ref:
        description: "astrogl branch holding layer/osm-routes scripts"
        default: "preview"
      limit:
        description: "Max cities to build (empty = all)"
        default: ""

concurrency:
  group: osm-route-relations
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout site scripts
        uses: actions/checkout@v4
        with:
          repository: ayeeff/astrogl
          ref: ${{ inputs.site_ref || 'preview' }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (python osmium + build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libosmium-dev libprotozero-dev libexpat1-dev zlib1g-dev libbz2-dev liblz4-dev libcurl4-openssl-dev libboost-program-options-dev nlohmann-json3-dev python3-pip
          pip3 install --break-system-packages osmium

      # apt osmium-tool has NO libcurl input support ("No such file or directory"
      # on URLs) and reference completion cannot read from a pipe, so build
      # osmium-tool from source WITH curl to read the presigned R2 URL directly
      # (range requests = seekable, two passes over 88 GiB, R2 egress free).
      - name: Build osmium-tool with curl support
        run: |
          git clone --depth 1 --branch v1.17.0 https://github.com/osmcode/osmium-tool.git
          cd osmium-tool && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_DEFAULT_CMP0167=OLD > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          osmium --version | head -2
          osmium fileinfo https://example.com/x.pbf 2>&1 | head -2 || true

      - name: Install node deps
        run: npm ci --prefix site

      - name: Fetch go-pmtiles CLI
        run: |
          curl -fsSL --retry 3 -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar xzf pmtiles.tar.gz
          mkdir -p bin && mv pmtiles bin/pmtiles && chmod +x bin/pmtiles
          ./bin/pmtiles --help | head -3

      # osmium's reference completion needs a SEEKABLE input, so a plain pipe
      # from `aws s3 cp -` is not enough. Instead presign the R2 object and let
      # osmium read the URL directly (libcurl + range requests; the planet is
      # read twice, R2 egress is free).
      - name: Presign planet URL + tags-filter via osmium
        timeout-minutes: 240
        run: |
          set -o pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip && sudo ./aws/install --update
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          mkdir -p work
          URL=$(aws s3 presign "s3://geo-datalake/sources/osm/${{ inputs.planet_key }}" \
            --endpoint-url "https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com" --expires-in 604800)
          echo "presigned url length: ${#URL}"
          osmium fileinfo "$URL" | head -20
          time osmium tags-filter "$URL" \
            "r/route=train" "r/route=subway" "r/route=tram" "r/route=light_rail" \
            "r/route=monorail" "r/route=funicular" "r/route=railway" "r/route=ferry" \
            -F pbf -o work/routes.osm.pbf --overwrite
          ls -la work/
          df -h /
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Assemble route geometries
        run: |
          python3 site/layer/osm-routes/extract-route-relations.py work/routes.osm.pbf work/out site/layer/osm-routes/cities.json
          ls work/out/city-geoms | head -20
          du -sh work/out/city-geoms

      - name: Build + upload pmtiles
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PMTILES_BIN: ${{ github.workspace }}/bin/pmtiles
        run: |
          ARGS="work/out"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          node site/layer/osm-routes/build-city-osmtransit.mjs $ARGS

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-route-summary
          path: |
            work/out/summary.json
            work/out/build-summary.json
