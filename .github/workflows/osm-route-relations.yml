name: OSM route relations -> per-city transit pmtiles

# "Compute-near-data" pass over the planet.pbf sitting in the geo-datalake R2
# bucket (88 GiB): the runner disk cannot hold it and libosmium has no HTTP
# input, so the planet is STREAMED from R2 three times (single-pass osmium
# commands, stdin-compatible; R2 egress is free):
#
#   Pass A: osmium tags-filter -R  -> relations.osm.pbf (matched route relations)
#   Pass B: osmium getid -i wayids.txt   -> ways.osm.pbf  (member ways)
#   Pass C: osmium getid -i nodeids.txt  -> nodes.osm.pbf (referenced nodes)
#   Merge:  osmium cat -> routes.osm.pbf -> python assembly -> per-city pmtiles
#
# The extraction scripts + city list live in the geo site repo
# (ayeeff/astrogl, branch preview, layer/osm-routes/).
#
# Lives in this repo because GitHub only registers workflow_dispatch on the
# default branch, and astrogl's default branch (master) must not be touched.

on:
  workflow_dispatch:
    inputs:
      planet_key:
        description: "planet pbf key in geo-datalake/sources/osm/"
        default: "planet-260914.osm.pbf"
      site_ref:
        description: "astrogl branch holding layer/osm-routes scripts"
        default: "preview"
      limit:
        description: "Max cities to build (empty = all)"
        default: ""

concurrency:
  group: osm-route-relations
  cancel-in-progress: false

env:
  PLANET: s3://geo-datalake/sources/osm/${{ inputs.planet_key || 'planet-260914.osm.pbf' }}
  ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout site scripts
        uses: actions/checkout@v4
        with:
          repository: ayeeff/astrogl
          ref: ${{ inputs.site_ref || 'preview' }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (python osmium + build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libosmium-dev libprotozero-dev libexpat1-dev zlib1g-dev libbz2-dev liblz4-dev libboost-program-options-dev nlohmann-json3-dev python3-pip
          pip3 install --break-system-packages osmium

      # apt osmium-tool is fine here (no URL reading needed anymore), but a
      # from-source build keeps feature parity with what we tested (lz4 etc.).
      - name: Build osmium-tool
        run: |
          git clone --depth 1 --branch v1.17.0 https://github.com/osmcode/osmium-tool.git
          cd osmium-tool && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_DEFAULT_CMP0167=OLD > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          osmium --version | head -2

      - name: Install AWS CLI v2
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip && sudo ./aws/install --update
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws --version
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # The three streamed streams (relations/ways/nodes pbf) are cached so a
      # retry after a later-step failure does not re-stream 264 GiB.
      - uses: actions/cache/restore@v4
        id: streams
        with:
          path: |
            work/relations.osm.pbf
            work/ways.osm.pbf
            work/nodes.osm.pbf
          key: osm-routes-${{ inputs.planet_key || 'planet-260914.osm.pbf' }}-v1

      - name: Pass A - stream planet -> matched relations (tags-filter -R)
        if: steps.streams.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -o pipefail
          mkdir -p work
          time aws s3 cp "$PLANET" - --endpoint-url "$ENDPOINT" \
          | osmium tags-filter -R -F pbf - \
            "r/route=train" "r/route=subway" "r/route=tram" "r/route=light_rail" \
            "r/route=monorail" "r/route=funicular" "r/route=railway" "r/route=ferry" \
            -o work/relations.osm.pbf --overwrite
          ls -la work/relations.osm.pbf

      - name: Collect member-way IDs
        if: steps.streams.outputs.cache-hit != 'true'
        run: |
          python3 site/layer/osm-routes/collect-ids.py ways work/relations.osm.pbf work/wayids.txt
          wc -l work/wayids.txt

      - name: Pass B - stream planet -> member ways (getid)
        if: steps.streams.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -o pipefail
          time aws s3 cp "$PLANET" - --endpoint-url "$ENDPOINT" \
          | osmium getid -F pbf -i work/wayids.txt - -o work/ways.osm.pbf --overwrite
          ls -la work/ways.osm.pbf

      - name: Collect referenced-node IDs
        if: steps.streams.outputs.cache-hit != 'true'
        run: |
          python3 site/layer/osm-routes/collect-ids.py nodes work/ways.osm.pbf work/nodeids.txt
          wc -l work/nodeids.txt

      - name: Pass C - stream planet -> referenced nodes (getid)
        if: steps.streams.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -o pipefail
          time aws s3 cp "$PLANET" - --endpoint-url "$ENDPOINT" \
          | osmium getid -F pbf -i work/nodeids.txt - -o work/nodes.osm.pbf --overwrite
          ls -la work/nodes.osm.pbf
          df -h /

      - name: Save streams cache
        if: always() && steps.streams.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/relations.osm.pbf
            work/ways.osm.pbf
            work/nodes.osm.pbf
          key: osm-routes-${{ inputs.planet_key || 'planet-260914.osm.pbf' }}-v1

      - name: Merge type streams into routes.osm.pbf
        run: |
          osmium cat work/nodes.osm.pbf work/ways.osm.pbf work/relations.osm.pbf -o work/routes.osm.pbf --overwrite
          osmium fileinfo work/routes.osm.pbf | head -12
          df -h /

      - name: Assemble route geometries
        run: |
          python3 site/layer/osm-routes/extract-route-relations.py work/routes.osm.pbf work/out site/layer/osm-routes/cities.json
          ls work/out/city-geoms | head -20
          du -sh work/out/city-geoms

      - name: Build + upload pmtiles
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PMTILES_BIN: ${{ github.workspace }}/bin/pmtiles
        run: |
          curl -fsSL --retry 3 -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar xzf pmtiles.tar.gz
          mkdir -p bin && mv pmtiles bin/pmtiles && chmod +x bin/pmtiles
          ARGS="work/out"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          node site/layer/osm-routes/build-city-osmtransit.mjs $ARGS

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-route-summary
          path: |
            work/out/summary.json
            work/out/build-summary.json
